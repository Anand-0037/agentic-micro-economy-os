services:
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: ameo-worker
    env_file:
      - .env
    environment:
      MEMORY_DB_PATH: ${MEMORY_DB_PATH:-/data/ameo.db}
      ZERO_G_CLI_PATH: /usr/local/bin/0g-storage-client
    ports:
      - "8000:8000"
    volumes:
      - ameo-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ameo-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_WORKER_URL: ${VITE_WORKER_URL:-http://localhost:8000}
        VITE_MANTLE_RPC_URL: ${VITE_MANTLE_RPC_URL:-https://rpc.sepolia.mantle.xyz}
        VITE_MANTLE_CHAIN_ID: ${VITE_MANTLE_CHAIN_ID:-5003}
        VITE_AGENT_IDENTITY_ADDRESS: ${VITE_AGENT_IDENTITY_ADDRESS:-0x8aC72a4B26e973FCdD7dAadd960Ae0eC635b4197}
        VITE_AGENT_TOKEN_ID: ${VITE_AGENT_TOKEN_ID:-0}
        VITE_MANTLE_EXPLORER_BASE: ${VITE_MANTLE_EXPLORER_BASE:-https://sepolia.mantlescan.xyz}
        VITE_LOG_FROM_BLOCK: ${VITE_LOG_FROM_BLOCK:-12500000}
        VITE_TREASURY_EOA: ${VITE_TREASURY_EOA:-${TREASURY_EOA:-}}
        VITE_DOCS_URL: ${VITE_DOCS_URL:-https://docs.ameo.agiwithai.com}
        VITE_GITHUB_URL: ${VITE_GITHUB_URL:-https://github.com/Anand-0037/agentic-micro-economy-os}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-0.2.0}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-${SENTRY_DSN:-}}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-${SENTRY_ENVIRONMENT:-production}}
        VITE_0G_INDEXER_URL: ${VITE_0G_INDEXER_URL:-https://indexer-storage-testnet-turbo.0g.ai}
        VITE_EXECUTION_ADAPTER: ${VITE_EXECUTION_ADAPTER:-fusionx_v2}
        VITE_EXECUTION_ADAPTER_LABEL: ${VITE_EXECUTION_ADAPTER_LABEL:-FusionX V2}
        VITE_FUSIONX_V2_ROUTER: ${VITE_FUSIONX_V2_ROUTER:-0x45e6f621c5ED8616cCFB9bBaeBAcF9638aBB0033}
        VITE_LLM_PROVIDER_LABEL: ${VITE_LLM_PROVIDER_LABEL:-z.ai}
        VITE_Z_AI_MODEL: ${VITE_Z_AI_MODEL:-glm-4-plus}
        VITE_VOLATILITY_THRESHOLD_PCT: ${VITE_VOLATILITY_THRESHOLD_PCT:-0.03}
        VITE_MAX_TRADE_USD: ${VITE_MAX_TRADE_USD:-250}
    container_name: ameo-web
    ports:
      - "5173:80"
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - ameo-net

volumes:
  ameo-data:

networks:
  ameo-net:
    driver: bridge
