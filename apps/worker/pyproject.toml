[project]
name = "ameo-worker"
version = "0.1.0"
description = "AMEO agent worker (FastAPI + LangGraph)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.23.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.3.0",
  "langgraph>=0.1.0",
  "langchain-core>=0.2.0",
  "langchain-openai>=0.2.0",
  "langchain-google-genai>=2.0.0",
  "httpx>=0.27.0",
  "web3>=6.0.0",
  "sentry-sdk>=2.0.0",
  "apscheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
